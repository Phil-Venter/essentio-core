name: tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate-and-test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ["8.2", "8.3", "8.4"]
        name: Test on PHP ${{ matrix.php }}

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo, pdo_sqlite
                  coverage: none

            - name: Validate composer.json and composer.lock
              run: composer validate --strict

            - name: Cache Composer packages
              id: cache-vendor-php${{ matrix.php }}
              uses: actions/cache@v3
              with:
                  path: vendor
                  key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-php-

            - name: Install dependencies
              if: steps.cache-vendor-php${{ matrix.php }}.outputs.cache-hit != 'true
              run: composer install --prefer-dist --no-progress

            - name: Run analyzer
              run: php ./vendor/bin/psalm --threads=8

            - name: Run test suite
              run: php ./vendor/bin/pest --parallel

    build-and-commit:
        runs-on: ubuntu-latest
        needs: validate-and-test
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2"
                  coverage: none

            - name: Build dist
              run: |
                  composer build:all+
                  composer update-readme-with-cloc

            - name: Commit and push changes
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -f dist/* README.md
                  git commit -m "[action] Build dist" || exit 0
                  git push
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
