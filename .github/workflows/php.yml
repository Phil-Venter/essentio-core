name: tests

on:
    push:
        branches: ["main"]
        paths-ignore:
            - "dist/**"
            - "README.md"
    pull_request:
        branches: ["main"]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate-and-test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ["8.2", "8.3", "8.4"]
        name: Test on PHP ${{ matrix.php }}

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo, pdo_sqlite, curl
                  ini-values: memory_limit=-1
                  coverage: none
                  tools: composer:v2

            - run: composer validate --strict

            - uses: ramsey/composer-install@v3
              with:
                  composer-options: --no-interaction --prefer-dist

            - run: php ./vendor/bin/rector --dry-run --no-diffs
            - run: php ./vendor/bin/psalm --threads=8 --taint-analysis --output-format=github
            - run: php ./vendor/bin/pest --parallel

    build-and-commit:
        runs-on: ubuntu-latest
        needs: validate-and-test
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2"
                  coverage: none

            - name: Build dist
              run: |
                  composer build:all+
                  composer update-readme-with-cloc

            - name: Commit and push changes
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch origin main
                  git rebase origin/main || true
                  git add -f dist/* README.md
                  git commit -m "[action] Build dist" || exit 0
                  git push
